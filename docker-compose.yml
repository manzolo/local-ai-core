# local-ai-core — local AI services on your own GPU behind one API and a web UI.
#
#   docker compose up -d                    gateway + Ollama + search/ask   → http://localhost:8090
#   docker compose --profile docs up -d     + documents → Markdown (Docling, ~7 GB image, ~3 GB VRAM)
#   --profile transcribe                    + speech → text and subtitles (faster-whisper, ~3.4 GB, ~5 GB VRAM)
#   --profile speakers                      + who said what (SpeechBrain, ~6.6 GB, ~1 GB VRAM)
#   --profile image                         + images: generate, upscale, cut out (ComfyUI, ~10 GB, ~8 GB VRAM)
#   --profile handwriting                   + handwritten notes → text (qwen3-vl on Ollama, ~7 GB VRAM)
#   --profile voice                         + text → speech (XTTS-v2: NON-COMMERCIAL use only, see .env)
#
# Standalone: this file brings its own Ollama and never touches the shared `local-ai-net` network.
# To use the Ollama of the local-ai-lab family instead, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.local-ai.yml up -d
# Settings live in .env (copy .env.example); every variable has a sensible default.
name: local-ai-core

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: local-ai-core/gateway:0.1.0
    ports:
      # 127.0.0.1 by default: opening the gateway to the LAN is an explicit choice (BIND_ADDR=0.0.0.0)
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-8090}:8090"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:8b-instruct}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      AUTO_PULL_MODELS: ${AUTO_PULL_MODELS:-true}
      AUTO_INDEX: ${AUTO_INDEX:-true}
      WORKERS: >-
        search=http://search:8000 documents=http://documents:8000
        transcriber=http://transcriber:8000 speakers=http://speakers:8000 image=http://image:8000
        reader=http://reader:8000 voice=http://voice:8000
    volumes:
      - gateway-data:/data
      - uploads:/data/uploads       # files being converted: deleted when their job ends
      - library:/library            # converted documents kept for search and ask
    depends_on:
      - search
    deploy:
      resources:
        reservations:
          devices:
            # only nvidia-smi for the status bar: the gateway itself uses no VRAM
            - driver: nvidia
              count: all
              capabilities: [utility]
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    image: local-ai-core/search:0.1.0
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      SEARCH_MIN_SCORE: ${SEARCH_MIN_SCORE:-0.35}
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
    volumes:
      - index:/data/index
      - library:/library:ro
      # the notes to search, read-only: point NOTES_DIR at your own folder of Markdown files
      - ${NOTES_DIR:-./examples/notes}:/notes:ro
    restart: unless-stopped

  documents:
    # PDF (scanned too), images, DOCX, PPTX, XLSX, HTML → Markdown. Off unless `--profile docs`.
    profiles: ["docs"]
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    image: local-ai-core/documents:0.1.0
    environment:
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
    volumes:
      - uploads:/data/uploads
      - documents-models:/models    # Docling and RapidOCR models, downloaded on first use
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  transcriber:
    # audio and video → text, SRT, WebVTT. Off unless `--profile transcribe`.
    profiles: ["transcribe"]
    build:
      context: .
      dockerfile: services/transcriber/Dockerfile
    image: local-ai-core/transcriber:0.1.0
    environment:
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
    volumes:
      - uploads:/data/uploads
      - transcriber-models:/models  # the Whisper model, downloaded on first use (~3 GB)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  speakers:
    # who said what, used by /v1/transcribe with speakers=true. Off unless `--profile speakers`.
    profiles: ["speakers"]
    build:
      context: .
      dockerfile: services/speakers/Dockerfile
    image: local-ai-core/speakers:0.1.0
    environment:
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
    volumes:
      - uploads:/data/uploads
      - speakers-models:/models     # the ECAPA model, downloaded on first use (~90 MB)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  image:
    # text → image, upscale, cut out, with ComfyUI (GPL-3.0, run unmodified). Off unless `--profile image`.
    profiles: ["image"]
    build:
      context: .
      dockerfile: services/image/Dockerfile
    image: local-ai-core/image:0.1.0
    environment:
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
      IMAGE_CHECKPOINT: ${IMAGE_CHECKPOINT:-}
    volumes:
      - uploads:/data/uploads
      - image-models:/models        # SDXL, Lightning, RealESRGAN, BiRefNet: ~7.8 GB, downloaded on first use
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  reader:
    # photos of handwritten notes → text, with a vision model on Ollama. Off unless `--profile handwriting`.
    profiles: ["handwriting"]
    build:
      context: .
      dockerfile: services/reader/Dockerfile
    image: local-ai-core/reader:0.1.0
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:8b-instruct}
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

  voice:
    # text → speech with XTTS-v2. NON-COMMERCIAL use only (Coqui Public Model License): it runs only after
    # you accept the license with XTTS_ACCEPT_CPML=yes in .env. Off unless `--profile voice`.
    profiles: ["voice"]
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    image: local-ai-core/voice:0.1.0
    environment:
      XTTS_ACCEPT_CPML: ${XTTS_ACCEPT_CPML:-}
      IDLE_UNLOAD_MINUTES: ${IDLE_UNLOAD_MINUTES:-10}
      TRANSCRIBER_URL: http://transcriber:8000   # each piece is listened to again when `transcribe` is on
    volumes:
      - uploads:/data/uploads
      - voice-models:/models        # XTTS-v2, ~1.9 GB, downloaded on first use after the license is accepted
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    # no published port and no fixed container name: it never clashes with an Ollama already on the host
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  gateway-data:
  index:
  library:
  uploads:
  documents-models:
  transcriber-models:
  speakers-models:
  image-models:
  voice-models:
  ollama:
